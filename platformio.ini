; PlatformIO project configuration
; ESP32-S3 WROOM cyber-security toolkit (OLED 0.96" SSD1306, I2C)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; USB-CDC serial monitor is used both for logs and as the input console
; (WiFi credentials, TOTP secrets) since the board has no keyboard/buttons
; beyond the built-in BOOT button.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.16.3
    h2zero/NimBLE-Arduino @ ^1.4.3
    marian-craciunescu/ESP32Ping @ ^1.7

; WiFi + NimBLE + mbedtls together don't fit the default (1.3MB app)
; partition table, so use the larger single-app layout. Needs a board
; with >= 4MB flash, which every ESP32-S3 WROOM module has.
board_build.partitions = huge_app.csv
